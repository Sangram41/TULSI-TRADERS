<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something's Growing — Tulsi Traders</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&display=swap');

:root{
  --cream:#F6F3EA;
  --soil:#5B4530;
  --deep-green:#0B5C46;
  --leaf:#5FA05A;
  --gold:#C99A3E;
  --ink:#1E2B22;
}

*{ margin:0; padding:0; box-sizing:border-box; }

html, body{
  height:100%;
}

body{
  font-family:'Lato', sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-x:hidden;
  position:relative;
}

/* subtle soil-grain texture using layered radial gradients */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(91,69,48,0.04) 0, transparent 45%),
    radial-gradient(circle at 80% 70%, rgba(11,92,70,0.05) 0, transparent 50%);
  pointer-events:none;
}

.stage{
  width:100%;
  max-width:640px;
  padding: 60px 32px;
  text-align:center;
  position:relative;
  z-index:1;
}

.mark{
  font-family:'Fraunces', serif;
  font-weight:500;
  font-size:15px;
  letter-spacing:0.02em;
  color: var(--deep-green);
  margin-bottom:64px;
}

/* --- The signature element: a sprout growing out of soil --- */
.sprout-wrap{
  width:180px;
  height:190px;
  margin:0 auto 40px;
  position:relative;
}

svg.sprout{
  width:100%;
  height:100%;
  overflow:visible;
}

.soil-mound{
  fill: var(--soil);
}

.stem{
  stroke: var(--leaf);
  stroke-width:4;
  stroke-linecap:round;
  fill:none;
  stroke-dasharray:120;
  stroke-dashoffset:120;
  animation: growStem 2.4s cubic-bezier(.32,.9,.35,1) 0.3s forwards;
}

.leaf{
  fill: var(--leaf);
  transform-origin: bottom center;
  transform: scale(0);
  opacity:0;
  animation: unfurl 1s cubic-bezier(.34,1.4,.4,1) forwards;
}

.leaf-left{ animation-delay: 1.7s; transform-origin: 90% 90%;}
.leaf-right{ animation-delay: 2.0s; transform-origin: 10% 90%;}

.bud{
  fill: var(--gold);
  transform-origin: center;
  transform: scale(0);
  animation: bloom 0.9s cubic-bezier(.34,1.6,.4,1) 2.5s forwards;
}

@keyframes growStem{
  to{ stroke-dashoffset:0; }
}
@keyframes unfurl{
  to{ transform: scale(1); opacity:1; }
}
@keyframes bloom{
  to{ transform: scale(1); }
}

@media (prefers-reduced-motion: reduce){
  .stem, .leaf, .bud{ animation: none !important; stroke-dashoffset:0 !important; transform:scale(1) !important; opacity:1 !important; }
}

h1{
  font-family:'Fraunces', serif;
  font-weight:400;
  font-style:italic;
  font-size: clamp(30px, 5vw, 42px);
  line-height:1.25;
  color: var(--deep-green);
  margin-bottom: 18px;
  letter-spacing:-0.01em;
}

.sub{
  font-size:16px;
  line-height:1.7;
  color:#4B5A4E;
  max-width: 440px;
  margin: 0 auto 46px;
}

/* growth-stage tracker, replacing a generic progress bar */
.stages{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin-bottom: 52px;
}

.stage-seg{
  height:3px;
  width:52px;
  border-radius:2px;
  background: rgba(11,92,70,0.14);
  position:relative;
  overflow:hidden;
}

.stage-seg.done{ background: var(--leaf); }

.stage-seg.current::after{
  content:'';
  position:absolute;
  inset:0;
  background: var(--gold);
  transform-origin:left;
  animation: fillCurrent 2.6s ease-out 0.2s forwards;
  transform: scaleX(0);
}

@keyframes fillCurrent{ to{ transform: scaleX(0.6); } }

.stage-labels{
  display:flex;
  justify-content:center;
  gap:20px;
  font-size:11px;
  letter-spacing:0.03em;
  color:#8A8377;
  margin-top: -40px;
  margin-bottom: 52px;
}

.notify{
  display:flex;
  gap:0;
  max-width:380px;
  margin: 0 auto;
  border: 1.5px solid rgba(11,92,70,0.25);
  border-radius: 8px;
  overflow:hidden;
  background:#fff;
  transition: border-color 0.25s ease;
}

.notify:focus-within{
  border-color: var(--deep-green);
}

.notify input{
  flex:1;
  border:none;
  outline:none;
  padding: 14px 16px;
  font-family:'Lato', sans-serif;
  font-size:14px;
  color: var(--ink);
  background:transparent;
  min-width:0;
}

.notify input::placeholder{ color:#A6A196; }

.notify button{
  border:none;
  background: var(--deep-green);
  color:#fff;
  font-family:'Lato', sans-serif;
  font-weight:700;
  font-size:13px;
  padding: 0 22px;
  cursor:pointer;
  transition: background 0.25s ease;
  white-space:nowrap;
}

.notify button:hover{ background:#084232; }
.notify button:focus-visible, .notify input:focus-visible{
  outline: 2px solid var(--gold);
  outline-offset:2px;
}

/* CSS-only "submit" interaction: a hidden checkbox toggles the confirmation
   and swaps the button label, with no JavaScript involved. */
#notifyCheck{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.notify-btn{
  border:none;
  background: var(--deep-green);
  color:#fff;
  font-family:'Lato', sans-serif;
  font-weight:700;
  font-size:13px;
  padding: 0 22px;
  cursor:pointer;
  transition: background 0.25s ease;
  white-space:nowrap;
  display:flex;
  align-items:center;
  justify-content:center;
}

.notify-btn:hover{ background:#084232; }

.notify-btn::before{ content:'Notify me'; }

#notifyCheck:checked ~ .notify .notify-btn{
  background: var(--leaf);
  pointer-events:none;
}

#notifyCheck:checked ~ .notify .notify-btn::before{ content:'Added ✓'; }

#notifyCheck:checked ~ .notify input{
  color:#8A8377;
}

.confirm{
  font-size:13px;
  color: var(--deep-green);
  margin-top:14px;
  height:16px;
  opacity:0;
  transition: opacity 0.3s ease;
}

#notifyCheck:checked ~ .confirm{ opacity:1; }

.footer-note{
  margin-top:56px;
  font-size:12px;
  color:#A6A196;
  letter-spacing:0.02em;
}

@media (max-width:480px){
  .stage{ padding:40px 22px; }
  .notify{ flex-direction:column; border-radius:8px; }
  .notify button{ padding:12px; }
  .stage-labels{ font-size:9px; gap:10px; }
}
</style>
</head>
<body>

<div class="stage">

  <div class="mark">TULSI TRADERS</div>

  <div class="sprout-wrap">
    <svg class="sprout" viewBox="0 0 180 190">
      <ellipse class="soil-mound" cx="90" cy="168" rx="72" ry="14"/>
      <path class="stem" d="M 90 165 C 90 130, 88 95, 90 60"/>
      <path class="leaf leaf-left" d="M 89 95 C 60 92, 45 75, 48 55 C 72 60, 88 75, 89 95 Z"/>
      <path class="leaf leaf-right" d="M 91 78 C 118 74, 132 58, 130 40 C 106 46, 92 60, 91 78 Z"/>
      <circle class="bud" cx="90" cy="58" r="9"/>
    </svg>
  </div>

  <h1>Something's growing here.</h1>
  <p class="sub">This page is still taking root. We're tending to it now and it'll be ready to harvest soon — come back shortly to see what's sprouted.</p>

  <div class="stages">
    <div class="stage-seg done"></div>
    <div class="stage-seg done"></div>
    <div class="stage-seg current"></div>
    <div class="stage-seg"></div>
  </div>
  <div class="stage-labels">
    <span>Planted</span>
    <span>Sprouted</span>
    <span>Growing</span>
    <span>Harvest</span>
  </div>

  <form action="http://localhost:3000/api/notify" method="POST" class="notify">
    <input type="email" name="email" placeholder="you@example.com" required>
    <button type="submit">Notify me</button>
</form>
  <div class="confirm">Thanks! We'll notify you when it's ready.</div>

  <div class="footer-note">© 2024 Tulsi Traders. All rights reserved.</div>
</div>

</body>
</html>
