<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- FontAwesome for the icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link rel="stylesheet" href="yellow.css?v=2">
    <title>LOGIN - Tulsi Traders</title>
</head>
<body class="login-body">
 <!-- Navbar -->
    <div class="navbar">
        <div class="container flex">
            <i class="fa-solid fa-bars" id="menu-icon"></i>
            <a href="TULSI1.html" >
        <h1 class="logo"><i class="fa-solid fa-shop"></i> TULSI TRADERS</h1>
    </a>
            <nav>
                <ul>
                    <li><a href="home.html">SHOP</a></li>
                    <li><a href="features.html">CONTACT US</a></li>
                    <li><a href="docs.html">OUR STORY</a></li>
                    <li><a href="shopping.html" class="nav-btn2"><i class="fa-solid fa-cart-shopping fa-flip"></i> CART</a></li>
                    <li>
                    <!-- Check that id="login-nav-item" is right here inside the <li> tag -->
                    <li id="login-nav-item">
                    <a href="login.html" class="nav-btn">
                    <i class="fa-solid fa-circle-user"></i> LOGIN</a>
                    <!-- Check that id="logout-nav-item" is right here inside this <li> tag -->
                    <li id="logout-nav-item" style="display: none;">
                    <a href="#" id="logout-btn" class="nav-btn">
                    <i class="fa-solid fa-circle-user"></i> <span id="user-email-display">EMAIL</span> | LOGOUT
                </a>
</li>
</li>
                </ul>
            </nav>
        </div>
    </div>
    <div class="split-screen">
        <!-- Left Side (Image & Glass Box) -->
        <div class="left-pane">
            <div class="glass-box">
                <h1>Tulsi Traders</h1>
                <p>Cultivating Freshness. Experience the finest organic produce, curated with care.</p>
            </div>
        </div>

        <!-- Right Side (Form) -->

        <div class="right-pane">
            <div class="form-wrapper">
                
                <!-- Tabs -->
                <div class="form-tabs">
                    <a href="login1.html" class="tab active">Login</a>
                    <a href="login.html" class="tab">Sign Up</a>
                </div>
                <div class="split-screen-container">

                <!-- Form Header -->
                <div class="form-header">
                    <form id="login-form">
                    <h2>Sign In</h2>
                    <p>Access your organic marketplace.</p>
                </div>

                <!-- Main Form -->
                <form>
                    <!-- Email Input -->
                    <div class="input-group">
                        <label for="email">EMAIL ADDRESS</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" id="email" placeholder="you@example.com" required>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="input-group">
                        <div class="label-flex">
                            <label for="password">PASSWORD</label>
                        </div>
                        <div class="input-icon-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="••••••••" required>
                        </div>
                                 <a href="#" class="forgot-link">Forgot?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-login-submit">Sign In &rarr;</button>
                </form>

                <!-- Divider -->
                <div class="divider">
                    <span>OR CONTINUE WITH</span>
                </div>

                <!--  Buttons -->
                <div class="social-logins"><button type="button" id="google-btn" class="social-btn"><i class="fa-brands fa-google"></i> Google</button>
                 <button type="button" id="github-btn" class="social-btn"><i class="fa-brands fa-github"></i> GitHub</button>
                </div>

            </div>
        </div>
    </div>
<script type="module" src="auth.js"></script>
</form>
</body>
</html>
